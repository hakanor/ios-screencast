<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<title>ios-screencast</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111111;
    --panel: #141414;
    --field: rgb(255 255 255 / 4%);
    --line: #2b2b2b;
    --line-strong: #3a3a3a;
    --text: #e6e6e6;
    --muted: #a3a3a3;
    --dim: #8a8a8a;
    --accent: #1db954;
    --accent-hover: #1ed760;
    --accent-text: #0b0b0b;
    --ok: #1db954;
    --warn: #f0a92a;
    --off: #4a4a4a;
    --broadcast: #1db954;
    --runner: #f0a92a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Public Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
  #target { color: var(--dim); font: 12px var(--mono); letter-spacing: 0.02em; }

  .label {
    font: 700 11px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px color-mix(in srgb, var(--ok) 60%, transparent); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 8px color-mix(in srgb, var(--warn) 70%, transparent); }

  main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }

  #stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px;
    min-width: 0;
    min-height: 0;
    background: radial-gradient(ellipse at 50% 40%, rgb(255 255 255 / 3%), transparent 60%);
  }
  #viewport { position: relative; flex: 1; width: 100%; min-height: 0; }
  .device {
    position: absolute;
    box-sizing: border-box;
    padding: 6px;
    border-radius: 14px;
    border: 1px solid var(--line-strong);
    background: #0a0a0a;
    transform-origin: center;
  }
  .device.framed {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: center / 100% 100% no-repeat;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
  }
  .device.framed canvas {
    position: absolute;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  .device[hidden] { display: none; }
  .empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--dim);
    font: 12px var(--mono);
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }
  .empty[hidden] { display: none; }

  #badge {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--muted);
    font: 700 11px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #badge.broadcast { color: var(--broadcast); border-color: color-mix(in srgb, var(--broadcast) 40%, transparent); }
  #badge.runner { color: var(--runner); border-color: color-mix(in srgb, var(--runner) 40%, transparent); }

  #stats { color: var(--dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }

  aside {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border-left: 1px solid var(--line);
    overflow: auto;
    min-height: 0;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 { margin: 0 0 12px; }

  .status-list { display: grid; gap: 9px; color: var(--muted); font-size: 13px; }
  .status-row { display: flex; align-items: center; gap: 10px; }

  .segmented {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .segmented button {
    border: 0;
    border-radius: 4px;
    padding: 5px 0;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--field); color: #fff; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .segmented button:disabled { cursor: default; opacity: 0.5; }
  .hint { margin: 0 0 14px; color: var(--dim); font-size: 12px; min-height: 2.8em; }

  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  select, input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--field);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  input { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  select:focus, input:focus { outline: none; border-color: var(--accent); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .notice { margin: 12px 0 0; color: var(--warn); font-size: 12px; }
  .notice[hidden] { display: none; }
  .button {
    border: 0;
    border-radius: 4px;
    padding: 6px 12px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .button:hover { background: var(--accent-hover); }
  .button.secondary { background: var(--field); color: var(--text); border: 1px solid var(--line); }
  .button.secondary:hover { background: rgb(255 255 255 / 8%); }

  details.card { padding: 0; }
  details.card summary { padding: 14px 16px; cursor: pointer; list-style: none; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "+"; float: right; color: var(--dim); }
  details.card[open] summary::after { content: "–"; }
  #log {
    max-height: 220px;
    overflow: auto;
    margin: 0;
    padding: 0 16px 14px;
    color: var(--dim);
    font: 11px/1.7 var(--mono);
    white-space: pre-wrap;
  }

  @media (max-width: 820px) {
    body { display: block; height: auto; }
    main { display: block; }
    #stage { padding: 48px 16px 20px; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    #viewport { flex: none; height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <h1>ios-screencast</h1>
  <span id="target">No device</span>
</header>

<main>
  <section id="stage">
    <div id="badge">waiting for video</div>
    <div id="viewport">
      <div class="device" id="device" hidden>
        <canvas id="screen" width="414" height="896"></canvas>
      </div>
      <div class="empty" id="empty">Connecting to the phone…</div>
    </div>
    <div id="stats">–</div>
  </section>

  <aside>
    <div class="card">
      <h2 class="label">Status</h2>
      <div class="status-list">
        <div class="status-row"><span class="dot" id="s-broadcast"></span>ReplayKit broadcast</div>
        <div class="status-row"><span class="dot" id="s-runner"></span>Runner</div>
        <div class="status-row"><span class="dot" id="s-alert"></span>System alert on screen</div>
      </div>
    </div>

    <div class="card">
      <h2 class="label">Stream</h2>
      <div class="segmented" role="group" aria-label="Mode">
        <button type="button" data-mode="mix">Mix</button>
        <button type="button" data-mode="broadcast">Broadcast</button>
        <button type="button" data-mode="runner">Runner</button>
      </div>
      <p class="hint" id="mode-hint"></p>

      <div class="field">
        <label class="label" for="preset">Quality</label>
        <select id="preset">
          <option value="1,60,12000000">Max · native, 60 fps, 12 Mbps</option>
          <option value="1,30,8000000">High · native, 30 fps, 8 Mbps</option>
          <option value="0.75,30,5000000">Balanced · 75%, 30 fps, 5 Mbps</option>
          <option value="0.5,30,2000000">Low · 50%, 30 fps, 2 Mbps</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="fields">
        <div class="field"><label class="label" for="scale">Scale</label><input id="scale" type="number" min="0.1" max="1" step="0.05"></div>
        <div class="field"><label class="label" for="fps">FPS</label><input id="fps" type="number" min="1" max="60" step="1"></div>
        <div class="field"><label class="label" for="mbps">Mbps</label><input id="mbps" type="number" min="0.5" max="50" step="0.5"></div>
      </div>
      <button class="button" id="apply" type="button">Apply</button>
    </div>

    <div class="card">
      <h2 class="label">Runner</h2>
      <div class="actions">
        <button class="button" id="start" type="button">Start runner</button>
        <button class="button secondary" id="broadcast" type="button">Start broadcast</button>
        <button class="button secondary" id="stop" type="button">Stop</button>
      </div>
      <p class="notice" id="notice" hidden></p>
    </div>

    <details class="card" open>
      <summary class="label">Log</summary>
      <pre id="log"></pre>
    </details>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $('screen'), ctx = canvas.getContext('2d');
const modeButtons = [...document.querySelectorAll('[data-mode]')];
const modeHints = {
  mix: 'ReplayKit for smooth video, switching to the runner while a system alert is on screen.',
  broadcast: 'ReplayKit only. Smoothest, but some system alerts are not visible.',
  runner: 'Runner screenshots only. Everything is visible, fps may be lower.'
};
let ws, decoder, codec, timestamp = 0, frames = 0, bytes = 0, mode = 'mix', rotation = 0;
let frame = null, frameBase, waitingForVideo = true, deviceTurns = 0;

async function loadFrame(base) {
  if (base === frameBase) return;
  frameBase = base;
  if (!base) return showDevice();
  try {
    const manifest = await (await fetch(base + 'manifest.json')).json();
    frame = { ...manifest, base };
    const device = $('device');
    device.classList.add('framed');
    device.style.backgroundImage = `url(${base}${manifest.frame.image})`;
    const r = manifest.frame.screenRect, w = manifest.frame.width, h = manifest.frame.height;
    const placement = {
      left: `${r.x / w * 100}%`, top: `${r.y / h * 100}%`,
      width: `${r.width / w * 100}%`, height: `${r.height / h * 100}%`
    };
    Object.assign(canvas.style, placement);
    if (manifest.screen.mask) {
      canvas.style.webkitMaskImage = canvas.style.maskImage = `url(${base}${manifest.screen.mask})`;
    }
  } catch (error) {
    log(`device frame: ${error.message}`);
    frame = null;
    $('device').classList.remove('framed');
  }
  showDevice();
}

function showDevice() {
  $('device').hidden = false;
  if (waitingForVideo) $('empty').textContent = 'Waiting for video from the phone…';
  layout();
}

function layout() {
  const box = $('viewport').getBoundingClientRect();
  const turns = frame ? deviceTurns : 0;
  const width = frame ? frame.frame.width : canvas.width + 14;
  const height = frame ? frame.frame.height : canvas.height + 14;
  const sideways = turns % 2 === 1;
  const fitWidth = sideways ? height : width, fitHeight = sideways ? width : height;
  const scale = Math.min(box.width / fitWidth, box.height / fitHeight);
  Object.assign($('device').style, {
    width: `${width * scale}px`, height: `${height * scale}px`,
    left: `${(box.width - width * scale) / 2}px`, top: `${(box.height - height * scale) / 2}px`,
    transform: `rotate(${turns * 90}deg)`
  });
}
window.addEventListener('resize', layout);

function log(message) {
  const line = `${new Date().toLocaleTimeString()}  ${message}\n`;
  $('log').textContent = line + $('log').textContent;
}

function dot(id, on, warn) {
  $(id).className = 'dot' + (on ? (warn ? ' warn' : ' on') : '');
}

function setMode(next) {
  mode = next;
  for (const button of modeButtons) button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
  $('mode-hint').textContent = modeHints[mode] || '';
}

function codecFromAccessUnit(data) {
  for (let i = 0; i + 4 < data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1 && (data[i + 3] & 0x1f) === 7) {
      const hex = b => b.toString(16).padStart(2, '0');
      return `avc1.${hex(data[i + 4])}${hex(data[i + 5])}${hex(data[i + 6])}`;
    }
  }
  return null;
}

function spsOf(data) {
  for (let i = 0; i + 4 < data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1 && (data[i + 3] & 0x1f) === 7) {
      let end = i + 4;
      while (end + 3 < data.length && !(data[end] === 0 && data[end + 1] === 0 && (data[end + 2] === 1 || data[end + 2] === 0))) end++;
      return Array.from(data.subarray(i + 3, end)).join(',');
    }
  }
  return null;
}
let lastSps = null;

function createDecoder() {
  decoder = new VideoDecoder({
    output: videoFrame => {
      const landscape = videoFrame.displayWidth > videoFrame.displayHeight;
      const turns = landscape ? (rotation === 3 ? 3 : 1) : (rotation === 2 ? 2 : 0);
      const counterTurns = frame ? turns : 0;
      const sideways = counterTurns % 2 === 1;
      const width = sideways ? videoFrame.displayHeight : videoFrame.displayWidth;
      const height = sideways ? videoFrame.displayWidth : videoFrame.displayHeight;
      if (canvas.width !== width || canvas.height !== height || deviceTurns !== turns) {
        canvas.width = width;
        canvas.height = height;
        deviceTurns = turns;
        layout();
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.translate(width / 2, height / 2);
      ctx.rotate(-counterTurns * Math.PI / 2);
      ctx.drawImage(videoFrame, -videoFrame.displayWidth / 2, -videoFrame.displayHeight / 2);
      videoFrame.close();
      frames++;
      waitingForVideo = false;
      $('empty').hidden = true;
    },
    error: e => { log(`decoder error: ${e.message}`); decoder = null; codec = null; }
  });
}

function onVideo(buffer) {
  const bytesIn = new Uint8Array(buffer);
  const flags = bytesIn[0], keyframe = (flags & 1) === 1, switched = (flags & 2) === 2;
  const data = bytesIn.subarray(1);
  bytes += data.length;

  const sps = keyframe ? spsOf(data) : null;
  if (!decoder || !codec || (keyframe && (switched || (sps && sps !== lastSps)))) {
    if (!keyframe) return;
    const next = codecFromAccessUnit(data);
    if (!next) return;
    if (!decoder) createDecoder();
    codec = next;
    lastSps = sps;
    decoder.configure({ codec, optimizeForLatency: true });
  }

  timestamp += 16666;
  decoder.decode(new EncodedVideoChunk({ type: keyframe ? 'key' : 'delta', timestamp, data }));
}

function onStatus(s) {
  rotation = s.rotation || 0;
  if (s.device) loadFrame(s.device.frame);
  dot('s-broadcast', s.broadcast);
  if (s.broadcast) $('notice').hidden = true;
  dot('s-runner', s.runner);
  dot('s-alert', s.alert, true);
  $('badge').textContent = s.source ? s.source : 'waiting';
  $('badge').className = s.source || '';
  if (s.device) {
    $('target').textContent = [s.device.name, s.device.model, s.device.iosVersion && `iOS ${s.device.iosVersion}`].filter(Boolean).join(' · ');
  }
  if (s.settings && !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) {
    setMode(s.settings.mode);
    $('scale').value = s.settings.scale;
    $('fps').value = s.settings.fps;
    $('mbps').value = s.settings.bitrate / 1e6;
    const key = `${s.settings.scale},${s.settings.fps},${s.settings.bitrate}`;
    $('preset').value = [...$('preset').options].some(o => o.value === key) ? key : 'custom';
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => log('viewer connected');
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onmessage = e => {
    if (typeof e.data !== 'string') return onVideo(e.data);
    const message = JSON.parse(e.data);
    if (message.type === 'status') onStatus(message);
    if (message.type === 'log') log(message.message);
    if (message.type === 'broadcastFailed') {
      $('notice').textContent = `${message.message} Press Start broadcast to try again.`;
      $('notice').hidden = false;
    }
  };
}

function send(object) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(object));
}

function applySettings() {
  send({
    type: 'settings',
    mode,
    scale: Number($('scale').value),
    fps: Number($('fps').value),
    bitrate: Math.round(Number($('mbps').value) * 1e6)
  });
}

for (const button of modeButtons) {
  button.onclick = () => { setMode(button.dataset.mode); applySettings(); };
}
$('start').onclick = () => send({ type: 'start' });
$('stop').onclick = () => send({ type: 'stop' });
$('broadcast').onclick = () => { $('notice').hidden = true; send({ type: 'broadcast' }); };
$('preset').onchange = () => {
  if ($('preset').value === 'custom') return;
  const [scale, fps, bitrate] = $('preset').value.split(',').map(Number);
  $('scale').value = scale; $('fps').value = fps; $('mbps').value = bitrate / 1e6;
};
$('apply').onclick = applySettings;

setInterval(() => {
  $('stats').textContent = `${canvas.width}×${canvas.height} · ${frames} fps · ${(bytes * 8 / 1e6).toFixed(1)} Mbps`;
  frames = 0; bytes = 0;
}, 1000);

setMode(mode);
layout();
if (!('VideoDecoder' in window)) log('This browser has no WebCodecs support. Use Chrome or Safari 16.4+.');
connect();
</script>
</body>
</html>
